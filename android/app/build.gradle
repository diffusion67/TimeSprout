plugins { id 'com.android.application' }

android {
    namespace 'top.dffapi.timesprout'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'top.dffapi.timesprout'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/assets').get().asFile]
}

tasks.register('copyWebApp', Copy) {
    from '../../index.html'
    into layout.buildDirectory.dir('generated/assets')
}
tasks.named('preBuild').configure { dependsOn tasks.named('copyWebApp') }

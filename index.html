  function guideView(){return `<section class="hero"><div><p class="eyebrow">使用说明</p><h1>三步，让时间<br><em>重新听你的。</em></h1><p class="subtle">不用一次把所有内容填完，从今天的一件事开始就够了。</p></div></section><section class="guideGrid"><article class="guideStep"><b>01 · 添加</b><h2>写下要做的事</h2><p>点击“添加任务”，输入名称和预计用时。系统会自动放进今天的空闲时段。</p></article><article class="guideStep"><b>02 · 打卡</b><h2>开始与结束</h2><p>开始时点击“开始打卡”，做完再点击“结束并完成”。未完成也可以延后或跳过。</p></article><article class="guideStep"><b>03 · 调整</b><h2>计划被打乱也没关系</h2><p>添加临时事项或处理逾期任务，系统会优先保护课程、睡眠和锁定事项，再重新安排任务。</p></article></section><section class="guideGrid" style="margin-top:18px"><article class="guideStep"><b>日历</b><h2>按天查看</h2><p>在“日历”里切换月份，点选日期即可集中查看课程、截止任务和临时事项。</p></article><article class="guideStep"><b>四象限</b><h2>先做更重要的事</h2><p>详细添加任务时勾选“重要”和“紧急”，系统会将待办放入对应象限。</p></article><article class="guideStep"><b>专注</b><h2>25 分钟一轮</h2><p>选中一件待办后开始番茄专注；25 分钟结束自动转为 5 分钟休息。</p></article></section><section class="card" style="margin-top:18px"><p class="eyebrow">提醒说明</p><h2>什么时候会提醒？</h2><p class="subtle">网页打开期间，会在任务开始前 10 分钟、任务开始时和任务逾期后提醒你。提醒只显示在网页内，不会向外发送任何数据。</p></section>`}
  function todayView(){let result=plan(),now=new Date(),overdue=state.tasks.filter(t=>!t.completed&&t.status!=='skipped'&&t.due&&parse(t.due)<now),unscheduled=result.unscheduled.filter(t=>t.id!=='daily-play'),live=buildLiveDashboardValues(result,now),language=activeLanguage();return `<section class="dashboardTop"><div><p class="eyebrow">今日总览 · ${today()}</p><h1>今天的安排</h1><p class="subtle">起床 ${state.settings.wake}　睡觉 ${state.settings.sleep}　玩乐 ${state.settings.play} 分钟</p></div><div class="dayClock" data-live-clock>${escapeHtml(live.clock)}</div></section><section class="status"><article class="card"><span>${message('status.current',{},language)}</span><b data-live-currentTitle>${escapeHtml(live.currentTitle)}</b><small data-live-currentTime>${escapeHtml(live.currentTime)}</small></article><article class="card"><span>下一件</span><b data-live-nextTitle>${escapeHtml(live.nextTitle)}</b><small data-live-nextTime>${escapeHtml(live.nextTime)}</small></article><article class="card ${overdue.length?'warning':''}"><span>${message('status.pending',{},language)}</span><b data-live-pending>${escapeHtml(live.pending)}</b><small data-live-overdue>${escapeHtml(live.overdue)}</small></article></section>${overdue.length?`<div class="alert"><b>有 ${overdue.length} 个任务已超时。</b><span>可以立即重新排入空闲时间。</span><button data-command="overdue">重新安排</button></div>`:''}<section class="card addPanel"><div class="addPanelHead"><b>快速添加</b><span>任务会自动排进空闲时间。</span></div>${addSection()}</section><div class="sectionHead"><div><p class="eyebrow">今日时间轴</p><h2>接下来做什么</h2></div>${state.undo?'<button class="outline" data-command="undo">↶ 撤销调整</button>':''}</div>${timeline(result)}${unscheduled.length?`<div class="alert"><b>暂时排不下：</b><span>${unscheduled.map(t=>escapeHtml(protectUserText(t.title))).join('、')}。可延后、缩短时长或调整作息。</span></div>`:''}`}
  function coursesView(){let list=state.courses.slice().sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start));return `<section class="hero"><div><p class="eyebrow">每周固定节奏</p><h1>把课表交给<br><em>系统来记。</em></h1></div></section><div class="grid"><form class="card form" data-form="course"><p class="eyebrow">添加课程</p><h2>新的一节课</h2><input name="title" placeholder="课程名称，例如高等数学" required><div class="row"><label>星期<select name="day">${days.map((d,i)=>`<option value="${i}" ${i===1?'selected':''}>${d}</option>`).join('')}</select></label><label>地点<input name="location" placeholder="教室（可选）"></label></div><div class="row"><label>开始<input name="start" type="time" value="08:00" required></label><label>结束<input name="end" type="time" value="09:40" required></label></div><button class="primary wide">保存到每周课表</button></form><div class="card"><p class="eyebrow">已添加的课程</p><h2>${list.length?list.length+' 节固定安排':'还没有课程'}</h2>${list.length?list.map(c=>`<div class="listRow"><span>${days[c.day]}<b>${c.start}</b></span><div><b>${renderUserField(c.title)}</b><small>${c.end}${c.location?' · '+renderUserField(c.location):''}</small></div><button class="icon" data-delete-course="${escapeHtml(c.id)}">×</button></div>`).join(''):'<div class="empty">从第一节课开始添加吧。</div>'}</div></div>`}
  function holidayView(){return `<section class="hero holidayHero"><div><p class="eyebrow">假期不必填满</p><h1>认真学习，也要<br><em>痛快地玩。</em></h1><p class="subtle">按日期生成学习任务，日程仍会保留你的玩乐时间。</p></div><b style="font-size:5rem;color:#e8ad38">☼</b></section><div class="grid"><form class="card form" data-form="holiday"><p class="eyebrow">假期规划向导</p><h2>留下一段好时光</h2><input name="title" placeholder="例如：国庆假期" required><div class="row"><label>开始<input name="start" type="date" required></label><label>结束<input name="end" type="date" required></label></div><label>每天学习<select name="minutes"><option value="45">45 分钟</option><option value="60">1 小时</option><option value="90" selected>1.5 小时</option><option value="120">2 小时</option></select></label><label>学习目标<textarea name="notes" placeholder="例如：每天完成一套卷子，读书 30 分钟"></textarea></label><button class="primary wide">生成假期学习任务</button></form><div class="card"><p class="eyebrow">我的假期</p><h2>${state.holidays.length?'计划中的留白':'还没有假期计划'}</h2>${state.holidays.length?state.holidays.map(h=>`<article class="holiday"><span>假期计划</span><h3>${renderUserField(h.title)}</h3><p>${h.start} 至 ${h.end} · 每天 ${h.minutes} 分钟</p><small>${h.notes?renderUserField(h.notes):'在设置中调整作息与玩乐时间，让系统为每一天留出空白。'}</small></article>`).join(''):'<div class="empty">一段假期，一个小目标，已经足够。</div>'}</div></div>`}
  function settingsView(){let importAction=pendingBackupImport?`<button class="dark" type="button" data-command="import-replace">${escapeHtml(t('danger.import-replace.label'))}</button>`:'';return `<div class="sectionHead"><div><p class="eyebrow">你的节奏</p><h1>作息不是约束，<br><em>是给自己的空间。</em></h1></div></div><form class="card settings" data-form="settings"><label>起床时间<input name="wake" type="time" value="${state.settings.wake}"></label><label>睡觉时间（早于起床即次日凌晨）<input name="sleep" type="time" value="${state.settings.sleep}"></label><label>每日玩乐时间<select name="play">${[0,30,60,90,120].map(n=>`<option value="${n}" ${n===Number(state.settings.play)?'selected':''}>${n?n+' 分钟':'暂不安排'}</option>`).join('')}</select></label><button class="primary">保存我的节奏</button></form><section class="card form" style="margin-top:18px"><p class="eyebrow">备份与转移</p><h2>导出计划</h2><p class="subtle">导出为 .txt 文件</p><button class="outline" type="button" data-command="backup-export">导出计划</button><label>导入备份<input data-backup-import type="file" accept=".txt,text/plain"></label><small class="muted">选择 TimeSprout .txt 备份文件</small>${importAction}</section><section class="card form warning" style="margin-top:18px"><p class="eyebrow">危险操作</p><h2>管理计划数据</h2><p class="subtle">这些操作需要连续两次确认，避免误操作。</p><div class="actions"><button class="outline" type="button" data-command="reset-settings">恢复默认作息设置</button><button class="dark" type="button" data-command="clear-plan">清空全部计划</button></div></section>${dangerConfirmationPanel()}<section class="history"><p class="eyebrow">最近调整</p>${state.history.length?state.history.map(h=>`<div><b>${escapeHtml(h.reason)}</b><span>${h.at.slice(5,16).replace('T',' ')}</span></div>`).join(''):'<div class="empty">你每一次主动调整，都会留在这里。</div>'}</section>`}
  function renderApp(){let language=activeLanguage(),view=tab==='today'?todayView():tab==='calendar'?calendarView():tab==='quadrants'?quadrantView():tab==='focus'?focusView():tab==='courses'?coursesView():tab==='holiday'?holidayView():tab==='guide'?guideView():settingsView(),planningToday=planningDate(iso(new Date()),state.settings.wake,state.settings.sleep),conflicts=tab==='today'?findFixedConflicts(fixedBlocks(planningToday)):[];document.querySelector('#app').innerHTML=`<header class="top"><div class="brand"><span class="mark">✦</span>TimeSprout</div><div class="topRight"><label class="language"><select data-language aria-label="Language"><option value="zh-CN" ${language==='zh-CN'?'selected':''}>中文</option><option value="en" ${language==='en'?'selected':''}>English</option></select></label><div class="date">${formatAppDate(new Date(),language)}</div></div></header><nav class="tabs">${[['today','今日'],['calendar','日历'],['quadrants','四象限'],['focus','专注'],['courses','课表'],['holiday','假期'],['guide','使用说明'],['settings','设置']].map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</nav>${notice?`<div class="toast"><span>✦ ${escapeHtml(notice)}</span><button data-command="notice">×</button></div>`:''}${conflicts.length?`<div class="alert"><b>发现 ${conflicts.length} 处固定事项冲突。</b><span>课程、临时事项或正在打卡的任务发生重叠，请调整其中一项。</span></div>`:''}<section>${view}</section><footer>今日有序 · 你的时间，应该听你的。</footer>`;localizeRenderedPage()}
  document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let command=b.dataset.command;if(command==='danger-cancel'){clearDangerConfirmation();renderApp();return}if(['import-replace','reset-settings','clear-plan'].includes(command)){runDangerAction(command);return}if(b.dataset.tab){clearDangerConfirmation();tab=b.dataset.tab;renderApp()}if(b.dataset.act)taskAction(b.dataset.id,b.dataset.act);if(command==='undo'&&state.undo){state=state.undo.state;notice='已撤销重排';save();renderApp()}if(command==='overdue')adjust('处理逾期任务',s=>s);if(command==='notice'){notice='';renderApp()}if(b.dataset.deleteCourse){state.courses=state.courses.filter(c=>c.id!==b.dataset.deleteCourse);save();renderApp()}if(b.dataset.calendarDay){let selection=moveCalendarSelection(b.dataset.calendarDay,0);selectedCalendarDate=selection.selectedDate;calendarCursor=new Date(`${selection.cursorDate}T12:00:00`);renderApp()}if(command==='calendar-prev'){let selection=moveCalendarSelection(selectedCalendarDate,-1);selectedCalendarDate=selection.selectedDate;calendarCursor=new Date(`${selection.cursorDate}T12:00:00`);renderApp()}if(command==='calendar-next'){let selection=moveCalendarSelection(selectedCalendarDate,1);selectedCalendarDate=selection.selectedDate;calendarCursor=new Date(`${selection.cursorDate}T12:00:00`);renderApp()}if(command==='focus-toggle'){let chosen=document.querySelector('[data-focus-task]')?.value||state.focus.taskId;if(!chosen&&state.focus.mode==='focus'){notice='先选择一个待办任务再开始专注';renderApp();return}let willRun=!state.focus.running;state.focus.taskId=chosen;state.focus.running=willRun;state.focus.lastTick=Date.now();if(willRun)state.focus.startedAt=iso(new Date());save();renderApp()}if(command==='focus-reset'){let chosen=document.querySelector('[data-focus-task]')?.value||state.focus.taskId;state.focus={...state.focus,...createFocusSession(chosen,iso(new Date())),running:false,lastTick:0};save();renderApp()}if(command==='focus-skip'){let isFocus=state.focus.mode==='focus';state.focus={...state.focus,mode:isFocus?'break':'focus',remainingSeconds:isFocus?300:1500,running:false,lastTick:0};save();renderApp()}});
  document.addEventListener('click',e=>{if(e.target.closest('button')?.dataset.command==='backup-export')exportBackupFile()});
  document.addEventListener('click',e=>{let button=e.target.closest('button');if(button?.dataset.command==='undo'&&!isValidUndoSnapshot(state.undo)){e.stopImmediatePropagation();state.undo=null;notice='撤销记录已失效，已安全清除。';save();renderApp()}},true);
  document.addEventListener('change',e=>{let target=e.target;if(target.matches('[data-language]')){state.settings.language=normalizeLanguage(target.value);save();renderApp();return}if(target.matches('[data-focus-task]')){state.focus.taskId=target.value;if(!state.focus.running){state.focus.remainingSeconds=1500;state.focus.mode='focus'}save()}});
  document.addEventListener('change',e=>{let input=e.target;if(input.matches('[data-backup-import]')){stageBackupFile(input.files?.[0]);input.value=''}});
  document.addEventListener('submit',e=>{let form=e.target,type=form.dataset.form;if(!type)return;let f=new FormData(form),validation='';if(type==='event'&&!isValidInterval(`${String(f.get('start'))}:00`,`${String(f.get('end'))}:00`))validation='validation.eventEnd';if(type==='course'&&(!isValidTime(String(f.get('start')))||!isValidTime(String(f.get('end')))||String(f.get('start'))>=String(f.get('end'))))validation='validation.courseEnd';if(type==='task'&&f.get('due')&&!isValidDateTime(String(f.get('due'))))validation='validation.dueDate';if(type==='settings'&&String(f.get('wake'))===String(f.get('sleep')))validation='validation.matchingSleep';else if(type==='settings'&&(!isValidTime(String(f.get('wake')))||!isValidTime(String(f.get('sleep')))))validation='validation.invalidRoutine';if(validation){e.preventDefault();e.stopImmediatePropagation();notice=message(validation,{},activeLanguage());renderApp()}},true);
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form!=='holiday')return;let f=new FormData(e.target);if(String(f.get('start'))>String(f.get('end'))){e.preventDefault();e.stopImmediatePropagation()}},true);
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form==='holiday')holidaySubmissionIds=new Set(state.tasks.map(task=>task.id))},true);
  document.addEventListener('submit',e=>{let form=e.target,type=form.dataset.form;if(!type)return;clearDangerConfirmation();e.preventDefault();let f=new FormData(form);
    if(type==='quick-task'){let title=String(f.get('title')).trim();if(!title)return;let taskId=id('task');adjust('添加任务',s=>{let date=planningDate(iso(new Date()),s.settings.wake,s.settings.sleep);s.tasks.push({id:taskId,title,duration:Number(f.get('duration')),priority:'medium',due:dayEndTime(date,s.settings.wake,s.settings.sleep),important:true,urgent:false,status:'pending'});return s});let placed=plan().blocks.find(b=>b.id===taskId),titleField=userField(title);notice=placed?localizedMessage('notice.scheduled',{start:fmt(placed.start),end:fmt(placed.end),title:titleField}):`已添加 ${protectUserText(title)}，暂时没有足够空闲时间`;save();renderApp()}
    if(type==='quick-event'){let title=String(f.get('title')).trim(),start=String(f.get('start'));if(!title||!start)return;let end=iso(new Date(parse(start).getTime()+Number(f.get('duration'))*60000));adjust('加入固定事项',s=>{s.events.push({id:id('event'),title,start:start+':00',end,kind:String(f.get('kind'))});return s})}
    if(type==='calendar-task'){let title=String(f.get('title')).trim();if(!title)return;adjust('添加新任务',s=>{s.tasks.push(createCalendarTask({title,duration:Number(f.get('duration')),priority:String(f.get('priority'))},selectedCalendarDate,s.settings,id('task')));return s})}
    if(type==='task'){let title=String(f.get('title')).trim();if(!title)return;adjust('添加新任务',s=>{let date=planningDate(iso(new Date()),s.settings.wake,s.settings.sleep);s.tasks.push({id:id('task'),title,duration:Number(f.get('duration')),priority:f.get('priority'),due:String(f.get('due')||dayEndTime(date,s.settings.wake,s.settings.sleep)),important:f.get('important')==='on',urgent:f.get('urgent')==='on',leisure:f.get('leisure')==='on',status:'pending'});return s})}
    if(type==='event'){let title=String(f.get('title')).trim(),start=String(f.get('start')),end=String(f.get('end'));if(!title||!start||!end)return;adjust('加入固定事项',s=>{s.events.push({id:id('event'),title,start:start+':00',end:end+':00',kind:f.get('locked')==='on'?'locked':'event'});return s})}
    if(type==='course'){let title=String(f.get('title')).trim();if(!title)return;state.courses.push({id:id('course'),title,day:Number(f.get('day')),start:String(f.get('start')),end:String(f.get('end')),location:String(f.get('location'))});notice='课程已加入每周课表';save();renderApp()}
    if(type==='holiday'){let start=String(f.get('start')),end=String(f.get('end')),title=String(f.get('title')).trim(),minutes=Number(f.get('minutes'));if(!title||!start||!end)return;let d=parse(start+'T12:00:00'),finish=parse(end+'T12:00:00'),tasks=[];while(d<=finish){let date=iso(d).slice(0,10);tasks.push({id:id('holiday'),title:`假期学习：${title} · ${date.slice(5)}`,duration:minutes,priority:'medium',due:dayEndTime(date,state.settings.wake,state.settings.sleep),date,important:true,urgent:false,status:'pending'});d.setDate(d.getDate()+1)}adjust('生成假期学习任务',s=>{s.holidays.push({id:id('holiday'),title,start,end,minutes,notes:String(f.get('notes'))});s.tasks.push(...tasks);return s})}
    if(type==='settings'){state.settings={wake:String(f.get('wake')),sleep:String(f.get('sleep')),play:Number(f.get('play'))};notice='作息设置已保存，今日已按新节奏重新计算。';save();renderApp()}
  });
  document.addEventListener('submit',e=>{if(e.target.dataset.form!=='course')return;let conflicts=findScheduleConflicts(state.courses,state.events);if(conflicts.length){notice=`课程已保存；发现 ${conflicts.length} 处固定事项冲突`;save();renderApp()}});
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form!=='holiday'||!holidaySubmissionIds)return;state.tasks=state.tasks.map(task=>holidaySubmissionIds.has(task.id)?task:{...task,title:task.title.slice('假期学习：'.length),generatedHoliday:true});holidaySubmissionIds=null;save();renderApp()});
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form==='settings')e.target.dataset.language=activeLanguage()},true);
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form==='settings'){state.settings.language=normalizeLanguage(e.target.dataset.language);save();renderApp()}});
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form!=='settings')return;let f=new FormData(e.target);state=updateSettingsState(state,{wake:f.get('wake'),sleep:f.get('sleep'),play:f.get('play')});state.settings.language=normalizeLanguage(e.target.dataset.language);save();renderApp()});
  document.addEventListener('click',e=>{let button=e.target.closest('button'),command=button?.dataset.command;if(button?.dataset.deleteCourse||['focus-toggle','focus-reset','focus-skip'].includes(command))state=clearUndo(state)},true);
  document.addEventListener('change',e=>{let target=e.target;if(target.matches('[data-language],[data-focus-task]'))state=clearUndo(state)},true);
  document.addEventListener('submit',e=>{if(['course','settings'].includes(e.target?.dataset?.form))state=clearUndo(state)},true);
  setInterval(()=>{let result=plan(),now=iso(new Date()),enqueue=(key,message)=>{if(!reminderKeys.has(key)&&!reminderQueue.some(item=>item.key===key))reminderQueue.push({key,message})};for(const block of result.blocks){let keyForBlock=reminderKey(block,now);if(keyForBlock)enqueue(keyForBlock,getReminderNotice(block,now))}for(const task of state.tasks.filter(t=>!t.completed&&t.status!=='skipped'&&t.due&&parse(t.due)<parse(now)))enqueue(`overdue:${task.id}`,reminderNotice('reminder.overdue',{title:userField(task.title),generatedHoliday:!!task.generatedHoliday}));const editing=document.activeElement&&document.activeElement.matches('input,select,textarea'),mode=refreshMode(reminderQueue.length>0,editing,tab);if(mode==='render'){let displayed=reminderQueue.slice(0,3),batch=takeReminderBatch(reminderQueue,3);reminderQueue=batch.remaining;displayed.forEach(item=>reminderKeys.add(item.key));notice=batch.shown.join(' · ');renderApp()}else if(mode==='live')updateLiveDashboard(document.querySelector('#app'),buildLiveDashboardValues(result,new Date()))},30000);
  focusTimer=setInterval(()=>{let tick=tickFocusState(state,Date.now());if(tick.state===state)return;state=tick.state;if(tick.notice)notice=tick.notice;save();let editing=document.activeElement&&document.activeElement.matches('input,select,textarea');if(tab==='focus'&&!editing)renderApp()},1000);
  renderApp();
})();
</script></body></html>

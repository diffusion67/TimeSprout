<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeSprout</title>
<style data-theme-tokens>
:root{--page-bg:#f2f5ef;--surface:#ffffff;--surface-soft:#f8faf6;--surface-raised:#e8eee7;--text:#18251d;--muted:#526358;--border:#7b8e7f;--primary:#176b50;--primary-foreground:#ffffff;--primary-shadow:#176b5035;--shadow:#1a302012;--shadow-strong:#10211630;--focus-ring:#176b50;--warning:#914c17;--warning-text:#673500;--warning-surface:#fff3e5;--warning-border:#a3521b;--success:#126a48;--timeline:#8dad96;--focus:#155c45;--conflict-surface:#fff0e7;--conflict-text:#792e14;--conflict-border:#a04420;--warm-surface:#fff8ee;--warm-border:#9c744c;--warm-accent:#794314;--warm-muted:#5b4936;--detail-text:#345243;--overdue-text:#a02627;--chart-leisure:#7449a2;--icon-surface:#e8eee7;--icon-text:#284638;--quadrant-do:#af2d2c;--quadrant-plan:#1b6f55;--quadrant-delegate:#905218;--quadrant-eliminate:#59665b;--holiday-icon:#8a541a;--growth:#176b50;--growth-foreground:#ffffff;--growth-soft:#e6f1e9;--growth-strong:#d1e8d8;--app-radius:22px;}
html[data-theme="dark"]{--page-bg:#111a15;--surface:#1e2c23;--surface-soft:#26372b;--surface-raised:#304638;--text:#f2f7f0;--muted:#bdcebd;--border:#90aa95;--primary:#a4dfb9;--primary-foreground:#10251a;--primary-shadow:#a4dfb935;--shadow:#00000038;--shadow-strong:#00000085;--focus-ring:#a4dfb9;--warning:#ffc184;--warning-text:#ffe2b9;--warning-surface:#4b3123;--warning-border:#ffbf7a;--success:#8cdda9;--timeline:#80a68a;--focus:#bdeac9;--conflict-surface:#542d23;--conflict-text:#ffe2ce;--conflict-border:#ffab88;--warm-surface:#3d3024;--warm-border:#d2a575;--warm-accent:#ffdbab;--warm-muted:#f0d9bb;--detail-text:#dcebdc;--overdue-text:#ffb8af;--chart-leisure:#dcc0ff;--icon-surface:#304638;--icon-text:#e5f2e6;--quadrant-do:#ffb8af;--quadrant-plan:#a4dfb9;--quadrant-delegate:#ffd49d;--quadrant-eliminate:#d2ddd2;--holiday-icon:#ffd49d;--growth:#a4dfb9;--growth-foreground:#10251a;--growth-soft:#2a4633;--growth-strong:#355740;--app-radius:22px;}
</style>
<style data-ui>
:root{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-width:320px;margin:0;background:radial-gradient(circle at 90% 0%,color-mix(in srgb,var(--primary) 8%,transparent),transparent 32rem),var(--page-bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1.07;letter-spacing:-.07em;margin-bottom:16px}
h2{font-size:1.25rem;line-height:1.25;letter-spacing:-.045em;margin-bottom:16px}
h3{letter-spacing:-.025em}
.app{width:min(100%,1440px);min-height:100vh;margin:auto;padding:24px clamp(18px,3.2vw,48px) 64px}
.appShell{display:grid;gap:22px}
.appContent{min-width:0}
.top{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.topRight{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-size:1.12rem;font-weight:850;letter-spacing:-.035em;white-space:nowrap}
.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:var(--primary);color:var(--primary-foreground);font-size:1.2rem;box-shadow:0 8px 16px var(--primary-shadow)}
.date{padding:9px 14px;border:1px solid color-mix(in srgb,var(--border) 35%,transparent);border-radius:999px;background:var(--surface);color:var(--detail-text);font-size:.82rem;font-weight:650;white-space:nowrap}
.language{display:block}
.language select{background:var(--surface-soft);color:var(--text);border:1px solid var(--border)}
.language select{width:auto;min-width:85px;padding:8px 30px 8px 11px;border-radius:10px;font-size:.82rem;font-weight:700}
.desktopNavigation{display:flex;align-items:center;gap:10px;max-width:100%;margin:0 0 24px;padding:7px;border:1px solid color-mix(in srgb,var(--border) 38%,transparent);border-radius:17px;background:var(--surface);box-shadow:0 7px 24px var(--shadow);overflow-x:auto;scrollbar-width:none}
.desktopNavigation::-webkit-scrollbar{display:none}
.navGroup{display:flex;align-items:center;gap:3px;flex:none}
.navGroup+.navGroup{padding-left:10px;border-left:1px solid color-mix(in srgb,var(--border) 40%,transparent)}
.navGroup:last-child{margin-left:auto}
.desktopNavigation button,.sidebarNavigation button{border:0;background:transparent;color:var(--muted);font-size:.84rem;font-weight:740;white-space:nowrap;transition:background .18s ease,color .18s ease,transform .18s ease}
.desktopNavigation button{padding:11px 15px;border-radius:12px}
.desktopNavigation button:hover,.sidebarNavigation button:hover{background:var(--surface-soft);color:var(--text)}
.desktopNavigation button.on{background:var(--primary);color:var(--primary-foreground);box-shadow:0 5px 12px var(--primary-shadow)}
.sidebarNavigation{display:none}
.mobileNavigation,.mobileMore{display:none}
.eyebrow{margin:0 0 11px;color:var(--primary);font-size:.72rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
.subtle,.muted{color:var(--muted)}
.subtle{font-size:.91rem;line-height:1.65;margin:0}
.card,.panel,.copy,.quadrant,.guideStep{border:1px solid color-mix(in srgb,var(--border) 36%,transparent);border-radius:var(--app-radius);background:var(--surface);box-shadow:0 10px 28px var(--shadow)}
.card,.panel{padding:22px}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 15px}
.sectionHead h1{font-size:clamp(1.9rem,3vw,2.6rem);margin:0 0 6px}
.sectionHead h2{margin:0}
.sectionHead .eyebrow{margin-bottom:6px}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:194px;margin-bottom:20px;padding:30px clamp(24px,3vw,42px);overflow:hidden;border:1px solid color-mix(in srgb,var(--primary) 20%,var(--border));border-radius:26px;background:linear-gradient(115deg,var(--growth-soft),var(--surface-soft) 62%,var(--surface));box-shadow:0 14px 34px var(--shadow)}
.hero:after{content:"";position:absolute;right:-68px;bottom:-122px;width:290px;height:290px;border:1px solid color-mix(in srgb,var(--primary) 16%,transparent);border-radius:50%;box-shadow:0 0 0 45px color-mix(in srgb,var(--primary) 3%,transparent),0 0 0 91px color-mix(in srgb,var(--primary) 3%,transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{margin-bottom:10px}
h1 em,.guideStep b{color:var(--primary)}
h1 em{font-style:normal}
.holidayHero{background:linear-gradient(110deg,var(--warm-surface),var(--surface-soft) 66%,var(--surface))}
.holidayHero:after{border-color:color-mix(in srgb,var(--warning) 20%,transparent)}
.todayCommandCenter{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(270px,.78fr);align-items:stretch;gap:14px;margin-bottom:26px}
.dashboardTop{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:245px;overflow:hidden;margin:0;padding:30px 34px;border:1px solid color-mix(in srgb,var(--primary) 22%,var(--border));border-radius:25px;background:linear-gradient(125deg,var(--growth-soft),var(--surface) 67%);box-shadow:0 14px 34px var(--shadow)}
.dashboardTop:after{content:"✦";position:absolute;right:-23px;top:-38px;width:170px;height:170px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--primary) 7%,transparent);color:color-mix(in srgb,var(--primary) 25%,transparent);font-size:6rem;pointer-events:none}
.dashboardTop h1{position:relative;z-index:1;margin:0 0 11px;font-size:clamp(2rem,3.1vw,3.1rem)}
.dashboardTop .subtle{position:relative;z-index:1;max-width:32rem}
.dashboardTop .eyebrow{margin-bottom:13px}
.dayClock{position:relative;z-index:1;display:inline-block;margin-top:24px;padding:9px 16px;border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);border-radius:999px;background:var(--surface);color:var(--primary);font-size:1.38rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.05em;box-shadow:0 4px 12px var(--shadow)}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.todayCommandCenter .status{grid-template-columns:1fr;gap:9px;margin:0}
.status .card{position:relative;min-width:0;padding:17px 20px;overflow:hidden;box-shadow:0 7px 18px var(--shadow)}
.status .card:before{content:"";position:absolute;inset:14px auto 14px 0;width:4px;border-radius:0 4px 4px 0;background:var(--primary)}
.status .card:nth-child(2):before{background:var(--warning)}
.status .card:nth-child(3):before{background:var(--success)}
.status span{display:block;margin-bottom:6px;color:var(--muted);font-size:.75rem;font-weight:780}
.status b{display:block;max-width:100%;margin-bottom:4px;overflow:hidden;color:var(--text);font-size:1.04rem;text-overflow:ellipsis;white-space:nowrap}
.status small{color:var(--muted);font-size:.76rem}
.warning{background:var(--warning-surface)!important;border-color:var(--warning-border)!important}
.alert,.toast{display:flex;align-items:center;gap:12px;padding:15px 18px;border:1px solid var(--warning-border);border-radius:15px;background:var(--warning-surface);font-size:.88rem;line-height:1.5}
.alert{margin:0 0 18px}
.alert span{flex:1;color:var(--warning-text)}
.toast{position:fixed;z-index:30;top:18px;right:18px;max-width:min(420px,calc(100vw - 36px));background:var(--surface);border-color:var(--border);box-shadow:0 18px 45px var(--shadow-strong)}
.toast button{margin-left:auto;border-radius:8px;background:var(--surface-raised);color:var(--text);font-size:1.1rem}
.primary,.dark,.outline,.actions button,.overdueActions button,.quadActions button,.calendarHead button,.focusControls button,.analyticsControls button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 15px;border-radius:11px;font-size:.81rem;font-weight:780;line-height:1.25;transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.primary,.actions .primary,.focusControls .primary,.overdueActions .primary,.quadActions .primary{background:var(--primary);color:var(--primary-foreground);box-shadow:0 5px 12px var(--primary-shadow)}
.dark{background:var(--text);color:var(--surface)}
.outline,.actions button,.overdueActions button,.quadActions button,.calendarHead button,.focusControls button,.analyticsControls button{border:1px solid color-mix(in srgb,var(--border) 48%,transparent);background:var(--surface-soft);color:var(--text)}
.primary:hover,.dark:hover,.outline:hover,.actions button:hover,.overdueActions button:hover,.quadActions button:hover,.calendarHead button:hover,.focusControls button:hover,.analyticsControls button:hover{transform:translateY(-1px);box-shadow:0 8px 18px var(--shadow)}
.primary:active,.dark:active,.outline:active,.actions button:active,.overdueActions button:active,.quadActions button:active{transform:translateY(0)}
.alert button{flex:none;background:var(--primary);color:var(--primary-foreground)}
.addPanel{margin:0 0 20px;padding:24px;background:var(--surface)}
.addPanelHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:17px}
.addPanelHead b{font-size:1.08rem;letter-spacing:-.035em}
.addPanelHead span{color:var(--muted);font-size:.78rem}
.quickGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quickGrid .card{box-shadow:none}
.quickGrid .form{align-content:start}
.quickGrid .form h2{margin-bottom:0;font-size:1.18rem}
.quickGrid .form>.subtle{min-height:2.7em}
.quickGrid .form>input{margin-top:8px}
.quickGrid .form>button{align-self:end}
.form{display:grid;gap:13px}
.form.warm,.quickGrid .warm{background:var(--warm-surface)}
.advanced{margin:14px 0 0}
.advanced summary{display:block;padding:13px 16px;border:1px dashed var(--border);border-radius:13px;background:var(--surface-soft);color:var(--detail-text);font-size:.82rem;font-weight:740;cursor:pointer;list-style:none}
.advanced summary::-webkit-details-marker{display:none}
.advanced summary::before{content:"＋";margin-right:8px;color:var(--primary)}
.advanced[open] summary::before{content:"－"}
.advanced .grid{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:7px;min-width:0;color:var(--detail-text);font-size:.79rem;font-weight:720;line-height:1.45}
input,select,textarea{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--border) 65%,transparent);border-radius:10px;background:var(--surface-soft);color:var(--text);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
textarea{min-height:100px;resize:vertical}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto;min-height:0;accent-color:var(--primary)}
.wide{width:100%}
.empty{padding:18px 20px;border:1px dashed color-mix(in srgb,var(--border) 58%,transparent);border-radius:15px;background:var(--surface-soft);color:var(--muted);font-size:.86rem;line-height:1.65}
.sectionHead.timelineHeader{padding-top:18px;border-top:1px solid color-mix(in srgb,var(--border) 35%,transparent)}
.timeline{position:relative}
.block{display:grid;grid-template-columns:63px 18px minmax(0,1fr) auto;column-gap:12px;min-height:90px}
.time{padding-top:20px;color:var(--muted);font-size:.74rem;text-align:right;font-variant-numeric:tabular-nums}
.time b{display:block;font-size:.87rem;font-weight:850}
.line{position:relative;width:2px;margin-left:8px;background:color-mix(in srgb,var(--timeline) 60%,transparent)}
.line:before{content:"";position:absolute;top:22px;left:-6px;width:14px;height:14px;border:3px solid var(--surface);border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.course .line:before{background:var(--success);box-shadow:0 0 0 2px var(--success)}
.event .line:before,.locked .line:before{background:var(--warning);box-shadow:0 0 0 2px var(--warning)}
.copy{min-width:0;margin-bottom:11px;padding:17px 19px;border-left:4px solid var(--primary);border-radius:16px;box-shadow:0 5px 16px var(--shadow)}
.block.task .copy{border-left-color:var(--primary)}
.block.course .copy{border-left-color:var(--success)}
.block.event .copy,.block.locked .copy{border-left-color:var(--warning)}
.copy .eyebrow{margin-bottom:5px;font-size:.62rem}
.copy h3{margin:0 0 6px;font-size:.98rem;line-height:1.4;overflow-wrap:anywhere}
.copy p{margin:0;color:var(--muted);font-size:.77rem}
.actions{display:flex;align-items:center;justify-content:flex-end;align-self:center;gap:7px;flex-wrap:wrap;min-width:0}
.actions button{min-height:38px;padding:8px 12px;font-size:.75rem}
.actions .check{font-size:.73rem}
.actions .check select{min-height:36px;padding:6px 9px}
.overdueQueue{margin:18px 0;background:var(--warning-surface)}
.overdueHead,.quadrantHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.overdueHead h2{margin-bottom:3px}
.overdueItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid color-mix(in srgb,var(--border) 35%,transparent)}
.overdueItem b{display:block;overflow-wrap:anywhere}
.overdueItem small{display:block;margin-top:5px;color:var(--warning);font-size:.76rem}
.overdueActions,.quadActions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.overdueActions button,.quadActions button{min-height:37px;padding:7px 11px;font-size:.74rem}
.listRow{display:grid;grid-template-columns:67px minmax(0,1fr) 30px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 35%,transparent)}
.listRow>span{color:var(--muted);font-size:.72rem}
.listRow>span b{display:block;margin-top:3px}
.listRow b{overflow-wrap:anywhere}
.listRow small{display:block;margin-top:5px;color:var(--muted);font-size:.74rem}
.icon{width:30px;height:30px;align-self:center;border-radius:9px;font-size:1.05rem}
.hide{display:none}
footer{margin-top:55px;color:var(--muted);font-size:.76rem;text-align:center}
.calendarWorkspace{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.75fr);align-items:start;gap:18px}
.calendarMonth,.calendarDetail{min-width:0}
.calendarMonth{overflow-x:auto}
.calendarDetail{position:sticky;top:20px}
.calendarHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.calendarHead h2{margin:0;font-size:1.18rem}
.calendarHead button{min-width:38px;min-height:38px;padding:7px}
.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(42px,1fr));gap:7px;min-width:340px}
.weekDay{padding:5px;color:var(--muted);font-size:.7rem;font-weight:780;text-align:center}
.dayCell{min-height:98px;padding:10px 8px;border:1px solid color-mix(in srgb,var(--border) 42%,transparent);border-radius:13px;background:var(--surface-soft);color:var(--text);text-align:left;vertical-align:top;transition:border-color .16s ease,background .16s ease,transform .16s ease}
.dayCell:hover{border-color:var(--primary);transform:translateY(-1px)}
.dayCell.out{opacity:.38}
.dayCell.selected{border-color:var(--primary);background:var(--growth-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 14%,transparent)}
.dayCell b{display:block;margin-bottom:7px;font-size:.8rem}
.dot{display:block;margin:3px 0;padding:3px 5px;overflow:hidden;border-radius:6px;background:var(--growth-soft);color:var(--primary);font-size:.64rem;text-overflow:ellipsis;white-space:nowrap}
.dot.course{background:color-mix(in srgb,var(--success) 16%,var(--surface));color:var(--success)}
.calendarDetail .eyebrow{margin-bottom:5px}
.calendarDetail h2{margin-bottom:12px}
.calendarAddForm{margin-top:18px;padding-top:17px;border-top:1px solid color-mix(in srgb,var(--border) 35%,transparent)}
.calendarDetail .listRow:last-of-type{border-bottom:0}
.quadrants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.quadrant{min-width:0;min-height:190px;padding:20px;border-top:4px solid var(--primary)}
.quadrant h2{margin:0 0 5px;font-size:1.08rem}
.quadrantHead p{margin:0 0 14px;color:var(--muted);font-size:.78rem}
.quadrant.do{border-top-color:var(--quadrant-do)}
.quadrant.plan{border-top-color:var(--quadrant-plan)}
.quadrant.delegate{border-top-color:var(--quadrant-delegate)}
.quadrant.eliminate{border-top-color:var(--quadrant-eliminate)}
.quadrantCount{display:grid;place-items:center;min-width:29px;height:29px;padding:0 7px;border-radius:999px;background:var(--surface-raised);color:var(--text);font-size:.74rem;font-weight:800}
.quadTask{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid color-mix(in srgb,var(--border) 32%,transparent);font-size:.86rem}
.quadTask>div:first-child{min-width:0}
.quadTask b{display:block;overflow-wrap:anywhere}
.quadTask small{display:block;margin-top:5px;color:var(--muted)}
.focusBox{position:relative;max-width:930px;margin:0 auto;padding:44px 32px;text-align:center;background:radial-gradient(circle at 50% 15%,var(--growth-soft),var(--surface) 56%)}
.focusMode{margin:0;color:var(--muted);font-size:.78rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
.focusClock{margin:15px 0 21px;color:var(--focus);font-size:clamp(4.2rem,11vw,7.5rem);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.085em;line-height:1}
.focusBox>label{max-width:360px;margin:auto;text-align:left}
.focusBox>.subtle{margin-top:16px}
.focusControls{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px}
.focusControls button{min-height:44px}
.focusStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:480px;margin:30px auto 0;text-align:left}
.focusStats .card{padding:16px 18px;box-shadow:none}
.focusStats span{font-size:.73rem;font-weight:740}
.focusStats b{display:block;margin-top:6px;font-size:1.35rem}
.analyticsHero{margin-bottom:19px}
.analyticsControls{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.analyticsControls button{min-height:42px}
.analyticsControls button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--primary-foreground)}
.analyticsControls label{min-width:182px;margin-left:auto}
.analyticsMetrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.analyticsMetric{min-width:0;min-height:126px;border-top:4px solid var(--primary)}
.analyticsMetric:nth-child(2){border-top-color:var(--success)}
.analyticsMetric:nth-child(3){border-top-color:var(--warning)}
.analyticsMetric:nth-child(4){border-top-color:var(--chart-leisure)}
.analyticsMetric span{display:block;margin-bottom:10px;color:var(--muted);font-size:.76rem;font-weight:800}
.analyticsMetric b{display:block;font-size:1.68rem;letter-spacing:-.05em}

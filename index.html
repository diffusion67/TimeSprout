<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeSprout</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--page-bg)}
*{box-sizing:border-box}
body{margin:0;min-width:320px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:1120px;margin:auto;padding:20px 24px 48px}
.top{height:52px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem}
.mark{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:var(--primary);color:var(--primary-foreground)}
.date{font-size:.85rem;color:var(--muted);background:var(--surface);padding:8px 13px;border-radius:999px}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--border);margin:20px 0 28px}
.tabs button{background:transparent;color:var(--muted);padding:11px 18px;font-weight:700}
.tabs button.on{color:var(--primary);box-shadow:inset 0 -2px var(--primary)}
.hero{display:flex;justify-content:space-between;align-items:center;min-height:188px;padding:28px 34px;margin-bottom:22px;border-radius:26px;background:linear-gradient(130deg,color-mix(in srgb,var(--primary) 18%,var(--page-bg)),var(--surface-soft) 62%,var(--surface))}
.holidayHero{background:linear-gradient(130deg,var(--warning-surface),var(--surface-soft) 60%,var(--surface))}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,5vw,3.45rem);line-height:1.05;letter-spacing:-.075em;margin-bottom:16px}
h1 em{font-style:normal;color:var(--primary)}
h2{font-size:1.2rem;letter-spacing:-.04em;margin-bottom:15px}
.eyebrow{font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:10px}
.subtle{color:var(--muted);font-size:.92rem;margin:0}
.clock{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-size:1.9rem;font-weight:800;box-shadow:0 18px 38px var(--primary-shadow)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}
.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 7px 22px var(--shadow)}
.status span{display:block;color:var(--muted);font-size:.75rem;font-weight:700;margin-bottom:9px}
.status b{display:block;font-size:1.02rem;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status small,.muted{color:var(--muted)}
.warning{background:var(--warning-surface)!important;border-color:var(--warning-border)!important}
.alert,.toast{padding:14px 16px;background:var(--warning-surface);border:1px solid var(--warning-border);border-radius:14px;display:flex;gap:10px;align-items:center;margin-bottom:20px;font-size:.9rem}
.alert span{color:var(--warning-text);flex:1}
.alert button,.primary{background:var(--primary);color:var(--primary-foreground);padding:9px 12px;border-radius:9px;font-size:.8rem;font-weight:800}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:30px 0 15px}
.outline{background:var(--surface);border:1px solid var(--border);padding:9px 12px;border-radius:10px;color:var(--text);font-weight:700}
.timeline{position:relative}
.block{display:grid;grid-template-columns:57px 18px minmax(0,1fr) auto;gap:10px;min-height:90px}
.time{font-size:.72rem;color:var(--muted);text-align:right;padding-top:13px}
.time b{display:block;color:var(--detail-text)}
.line{width:2px;background:var(--timeline);position:relative}
.line:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--primary);left:-4px;top:17px;box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,var(--surface))}
.course .line:before{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 20%,var(--surface))}
.event .line:before,.locked .line:before{background:var(--warning);box-shadow:0 0 0 4px color-mix(in srgb,var(--warning) 20%,var(--surface))}
.copy{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.copy h3{font-size:1rem;margin:0 0 5px}
.copy p{font-size:.78rem;color:var(--muted);margin:0}
.actions{align-self:center;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.actions button{border-radius:9px;padding:8px 10px;font-size:.78rem;font-weight:800;background:var(--surface-raised);color:var(--text)}
.actions .primary{background:var(--primary);color:var(--primary-foreground)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.form{display:grid;gap:12px}
.form.warm{background:var(--warm-surface)}
label{display:grid;gap:6px;font-size:.77rem;color:var(--muted);font-weight:700}
input,select,textarea{border:1px solid var(--border);background:var(--surface-soft);border-radius:9px;padding:10px;color:var(--text);outline-color:var(--focus-ring);width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.wide{width:100%;padding:11px}
.dark{background:var(--surface-raised);color:var(--text);border-radius:9px;padding:11px;font-weight:800}
.empty{color:var(--muted);background:var(--surface-soft);border-radius:12px;padding:18px;line-height:1.5}
.listRow{display:grid;grid-template-columns:62px 1fr 26px;gap:11px;padding:13px 0;border-bottom:1px solid var(--border)}
.listRow>span{font-size:.72rem;color:var(--muted)}
.listRow>span b{display:block;color:var(--detail-text);margin-top:3px}
.listRow small{display:block;color:var(--muted);font-size:.74rem;margin-top:4px}
.icon{align-self:center;border-radius:7px;background:var(--icon-surface);color:var(--icon-text);font-size:1.15rem}
.holiday{border:1px solid var(--warm-border);background:var(--warm-surface);padding:16px;border-radius:14px;margin-top:12px}
.holiday span{color:var(--warm-accent);font-size:.7rem;font-weight:800}
.holiday h3{margin:6px 0}
.holiday p,.holiday small{color:var(--warm-muted);font-size:.82rem}
.settings{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:13px;align-items:end}
.history{margin-top:30px;max-width:560px}
.history div{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:12px 0;font-size:.88rem}
.history span{color:var(--muted);font-size:.78rem}
.toast{position:fixed;z-index:5;right:20px;top:16px;max-width:360px;background:var(--surface-raised);color:var(--text);border:0;box-shadow:0 12px 30px var(--shadow-strong)}
.toast button{color:var(--text);background:none;font-size:1.2rem;margin-left:auto}
.hide{display:none}
footer{text-align:center;color:var(--muted);font-size:.77rem;margin-top:48px}
@media(max-width:700px){.app{padding:14px 14px 36px}
.date{display:none}
.tabs{margin-bottom:18px}
.tabs button{padding:10px 12px;font-size:.85rem}
.hero{padding:24px 21px;min-height:160px}
.clock{width:82px;height:82px;font-size:1.3rem}
.status,.grid{grid-template-columns:1fr;gap:8px}
.status .card{padding:13px}
.block{grid-template-columns:47px 14px minmax(0,1fr)}
.actions{grid-column:3;justify-content:start;margin:-3px 0 10px}
.settings{grid-template-columns:1fr}
.alert{align-items:flex-start;flex-wrap:wrap}
.alert button{margin-left:auto}
}

.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quickGrid .card{border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:none}
.quickGrid .warm{background:var(--warm-surface)}
.quickGrid .eyebrow,.quickGrid h2,.quickGrid .subtle{display:none}
.quickGrid .form{display:flex;align-items:end;gap:9px;flex-wrap:wrap}
.quickGrid .form>input{flex:1 1 160px}
.quickGrid .form>label{width:112px}
.quickGrid .form>.row{width:210px}
.quickGrid .form>button{width:auto;min-height:40px}
.advanced{margin-top:10px}
.advanced summary{list-style:none;color:var(--detail-text);font-size:.84rem;font-weight:800;cursor:pointer;padding:7px 2px}
.advanced summary::before{content:'＋ ';color:var(--primary)}
.advanced[open] summary::before{content:'－ '}
.addPanel{padding:15px;margin:16px 0}
.addPanelHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.addPanelHead b{font-size:1rem}
.addPanelHead span{font-size:.78rem;color:var(--muted)}
.guideGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.guideStep{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px}
.guideStep b{display:block;color:var(--primary);font-size:.8rem;margin-bottom:9px}
.guideStep h2{font-size:1.02rem}
.guideStep p{color:var(--muted);font-size:.85rem;line-height:1.6;margin:0}
.calendarHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendarHead h2{margin:0}
.calendarHead button{border-radius:8px;background:var(--surface-raised);color:var(--text);padding:7px 10px}
.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.weekDay{text-align:center;color:var(--muted);font-size:.72rem;font-weight:800;padding:5px}
.dayCell{min-height:92px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left;padding:9px;vertical-align:top}
.dayCell.out{opacity:.36}
.dayCell.selected{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 22%,var(--surface))}
.dayCell b{display:block;font-size:.8rem;margin-bottom:7px}
.dot{display:block;font-size:.66rem;border-radius:5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0;background:color-mix(in srgb,var(--primary) 17%,var(--surface));color:var(--primary)}
.dot.course{background:color-mix(in srgb,var(--success) 18%,var(--surface));color:var(--success)}
.overdueQueue{margin:16px 0;border-color:var(--warning-border);background:var(--warning-surface)}
.overdueHead,.quadrantHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.overdueHead h2{margin-bottom:0}
.overdueItem{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.overdueItem b{display:block}
.overdueItem small{display:block;color:var(--warning);margin-top:4px}
.overdueActions,.quadActions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.overdueActions button,.quadActions button{border-radius:8px;padding:6px 8px;background:var(--surface-raised);color:var(--text);font-size:.72rem;font-weight:800}
.overdueActions .primary,.quadActions .primary{background:var(--primary);color:var(--primary-foreground)}
.courseWeekWrap{overflow-x:auto}
.courseWeek{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:850px}
.courseDay{min-height:148px;padding:10px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--border)}
.courseDay h3{margin:0 0 8px;font-size:.8rem;color:var(--detail-text)}
.courseSlot{padding:8px;margin:5px 0;border-radius:8px;background:color-mix(in srgb,var(--success) 18%,var(--surface));color:var(--success);font-size:.75rem}
.courseSlot b{display:block;margin-bottom:3px}
.courseSlot.conflict{background:var(--conflict-surface);color:var(--conflict-text);box-shadow:inset 0 0 0 1px var(--conflict-border)}
.courseLegend{margin:12px 0 0;color:var(--warning);font-size:.76rem}
.quadrants{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.quadrant{min-height:190px;padding:17px;border-radius:17px;border:1px solid var(--border);background:var(--surface)}
.quadrant h2{font-size:1rem;margin-bottom:3px}
.quadrant>p{font-size:.77rem;color:var(--muted);margin-bottom:13px}
.quadrant.do{border-top:4px solid var(--quadrant-do)}
.quadrant.plan{border-top:4px solid var(--quadrant-plan)}
.quadrant.delegate{border-top:4px solid var(--quadrant-delegate)}
.quadrant.eliminate{border-top:4px solid var(--quadrant-eliminate)}
.quadrantCount{min-width:25px;padding:4px 7px;border-radius:999px;background:var(--surface-raised);color:var(--text);font-size:.72rem;font-weight:800;text-align:center}
.quadTask{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:.86rem}
.quadTask:first-of-type{border-top:0}
.quadTask b{display:block}
.quadTask small{display:block;margin-top:4px}
.quadTask.overdue small{color:var(--overdue-text)}
.focusBox{text-align:center;padding:28px}
.focusMode{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.1em}
.focusClock{font-variant-numeric:tabular-nums;font-size:clamp(3.2rem,12vw,6.3rem);font-weight:800;letter-spacing:-.08em;margin:13px 0;color:var(--focus)}
.focusControls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.focusControls button{padding:10px 15px;border-radius:10px;background:var(--surface-raised);color:var(--text);font-weight:800}
.focusControls .primary{background:var(--primary);color:var(--primary-foreground)}
.focusStats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;text-align:left}
.focusStats .card{padding:13px}
.focusStats b{display:block;font-size:1.35rem;margin-top:5px}
.hero{min-height:0;padding:18px 20px;margin-bottom:16px;border-radius:16px}
.hero h1{font-size:1.65rem;letter-spacing:-.045em;margin:0 0 7px}
.hero .eyebrow{margin-bottom:5px}
.dashboardTop{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:17px 19px;margin-bottom:12px}
.dashboardTop h1{font-size:1.45rem;letter-spacing:-.04em;margin:0 0 5px}
.dashboardTop .eyebrow{margin-bottom:5px}
.dayClock{font-variant-numeric:tabular-nums;font-size:1.55rem;font-weight:800;color:var(--primary);background:color-mix(in srgb,var(--primary) 17%,var(--surface));padding:10px 12px;border-radius:12px}
.sectionHead{margin:22px 0 12px}
.sectionHead h2{margin-bottom:0}
@media(max-width:700px){.quickGrid,.guideGrid,.quadrants{grid-template-columns:1fr}
.quickGrid .form>label,.quickGrid .form>.row{flex:1 1 130px;width:auto}
.quickGrid .form>button{width:100%}
.addPanelHead{align-items:flex-start;gap:8px;flex-direction:column}
.calendarGrid{gap:4px}
.dayCell{min-height:65px;padding:6px}
.dot{font-size:.57rem}
.tabs{overflow-x:auto}
.tabs button{white-space:nowrap}
.dashboardTop{padding:15px}
.dayClock{font-size:1.18rem}
.hero{padding:16px}
.overdueItem,.quadTask{align-items:flex-start;flex-direction:column}
.courseWeek{min-width:770px}
}

</style>
<style>
.sectionHead h1{font-size:1.65rem;letter-spacing:-.045em;margin:0 0 7px}
.sectionHead .eyebrow{margin-bottom:5px}
.topRight{display:flex;align-items:center;gap:9px}
.language select{width:auto;padding:7px 9px;font-size:.78rem;font-weight:700;background:var(--surface-soft)}
@media(max-width:700px){.actions button,.tabs button{min-height:44px}
.actions button{padding-inline:12px}
.date{display:none}
}

</style>
<style data-theme-tokens>
:root{--page-bg:#f5f6fb;--surface:#fff;--surface-soft:#fafbfe;--surface-raised:#edf0f8;--text:#20283d;--muted:#69718a;--border:#e3e6ef;--primary:#3558e6;--primary-foreground:#fff;--primary-shadow:#3558e655;--shadow:#2c3c7010;--shadow-strong:#151a3029;--focus-ring:#3558e6;--warning:#a56826;--warning-text:#604600;--warning-surface:#fff7e9;--warning-border:#c47b1d;--success:#17876d;--timeline:#d7ddeb;--focus:#263a82;--conflict-surface:#fff0dc;--conflict-text:#7a2e00;--conflict-border:#d45d00;--warm-surface:#fffaf1;--warm-border:#f0dfc5;--warm-accent:#8a4f00;--warm-muted:#665742;--detail-text:#45527b;--overdue-text:#a53d31;--chart-leisure:#7551b5;--icon-surface:#f4f5f9;--icon-text:#56617a;--quadrant-do:#b42318;--quadrant-plan:#3558e6;--quadrant-delegate:#8a4f00;--quadrant-eliminate:#596174;--holiday-icon:#8a4f00;}
html[data-theme="dark"]{--page-bg:#151927;--surface:#202738;--surface-soft:#283145;--surface-raised:#323d54;--text:#f2f5ff;--muted:#b6c0d3;--border:#71809f;--primary:#92a8ff;--primary-foreground:#11182c;--primary-shadow:#92a8ff45;--shadow:#00000044;--shadow-strong:#00000080;--focus-ring:#92a8ff;--warning:#ffd080;--warning-text:#ffe3b0;--warning-surface:#4b3820;--warning-border:#ffd080;--success:#76d8bd;--timeline:#71809f;--focus:#bcc8ff;--conflict-surface:#4b2a2a;--conflict-text:#ffe0d6;--conflict-border:#ff9b78;--warm-surface:#33281f;--warm-border:#c49b6e;--warm-accent:#ffd18a;--warm-muted:#e5cfac;--detail-text:#d9e1f2;--overdue-text:#ffb4ab;--chart-leisure:#cbb8ff;--icon-surface:#323d54;--icon-text:#e3ebff;--quadrant-do:#ffb4ab;--quadrant-plan:#92a8ff;--quadrant-delegate:#ffd080;--quadrant-eliminate:#c5cedf;--holiday-icon:#ffd080;}
</style>
<style>
:root{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{background:var(--page-bg);color:var(--text)}

.date,.card,.panel,.copy,.guideStep,.dayCell,.quadrant,.dashboardTop{background:var(--surface);border-color:var(--border);color:var(--text)}

.subtle,.muted,.status span,.status small,.time,.copy p,label,.listRow>span,.listRow small,.history span,.weekDay,.quadrant>p,.addPanelHead span{color:var(--muted)}

.tabs{border-color:var(--border)}
.tabs button{color:var(--muted)}
.tabs button.on{color:var(--primary);box-shadow:inset 0 -2px var(--primary)}

.mark,.clock,.primary,.actions .primary,.focusControls .primary{background:var(--primary);color:var(--primary-foreground)}

.hero{background:linear-gradient(130deg,color-mix(in srgb,var(--primary) 18%,var(--page-bg)),var(--surface-soft) 62%,var(--surface))}
.holidayHero{background:linear-gradient(130deg,var(--warning-surface),var(--surface-soft) 60%,var(--surface))}

.outline,.actions button,.calendarHead button,.overdueActions button,.quadActions button,.focusControls button,.quadrantCount{background:var(--surface-raised);border-color:var(--border);color:var(--text)}

input,select,textarea,.empty,.courseDay{background:var(--surface-soft);border-color:var(--border);color:var(--text)}
.language select{background:var(--surface-soft);color:var(--text);border:1px solid var(--border)}

.warning,.alert{background:var(--warning-surface)!important;border-color:var(--warning)!important;color:var(--text)}
.alert span,.overdueItem small,.courseLegend{color:var(--warning)}

.toast,.dark{background:var(--surface-raised);color:var(--text)}
.toast{border-color:var(--border)}
.toast button{color:var(--text)}

.line{background:var(--timeline)}
.line:before{background:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,var(--surface))}
.course .line:before{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 20%,var(--surface))}
.event .line:before,.locked .line:before{background:var(--warning);box-shadow:0 0 0 4px color-mix(in srgb,var(--warning) 20%,var(--surface))}

.listRow,.history div,.quadTask,.overdueItem{border-color:var(--border)}
.dayCell.selected{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 22%,var(--surface))}
.dot{background:color-mix(in srgb,var(--primary) 17%,var(--surface));color:var(--primary)}
.dot.course,.courseSlot{background:color-mix(in srgb,var(--success) 18%,var(--surface));color:var(--success)}

.courseSlot.conflict{background:var(--conflict-surface);color:var(--conflict-text);box-shadow:inset 0 0 0 1px var(--conflict-border)}
.focusClock{color:var(--focus)}
.dayClock{color:var(--primary);background:color-mix(in srgb,var(--primary) 17%,var(--surface))}

.form.warm,.quickGrid .warm{background:var(--warm-surface)}
.holiday{border-color:var(--warm-border);background:var(--warm-surface)}
.holiday span{color:var(--warm-accent)}
.holiday p,.holiday small{color:var(--warm-muted)}
h1 em,.guideStep b{color:var(--primary)}
.eyebrow,.focusMode{color:var(--muted)}

.time b,.listRow>span b,.advanced summary,.courseDay h3{color:var(--detail-text)}
.advanced summary::before{color:var(--primary)}
.guideStep p{color:var(--muted)}
.quadTask.overdue small{color:var(--overdue-text)}
.allocation.leisure,.allocationLegend.leisure::before{background:var(--chart-leisure)}
.icon{background:var(--icon-surface);color:var(--icon-text)}

.analyticsHero{margin-bottom:18px}
.analyticsControls{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.analyticsControls button{background:var(--surface-raised);border:1px solid var(--border);border-radius:9px;color:var(--text);font-weight:800;padding:9px 12px}
.analyticsControls button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.analyticsControls label{min-width:172px}
.analyticsMetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.analyticsMetric{min-width:0}
.analyticsMetric span{display:block;color:var(--muted);font-size:.77rem;font-weight:800;margin-bottom:9px}
.analyticsMetric b{display:block;font-size:1.55rem;letter-spacing:-.05em}
.analyticsMetric small{display:block;color:var(--muted);font-size:.76rem;margin-top:7px}
.analyticsGrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.85fr);gap:18px}
.trendRow+.trendRow{margin-top:20px}
.trendLabel{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:.8rem}

  function guideView(){return `<section class="hero"><div><p class="eyebrow">使用说明</p><h1>三步，让时间<br><em>重新听你的。</em></h1><p class="subtle">不用一次把所有内容填完，从今天的一件事开始就够了。</p></div></section><section class="guideGrid"><article class="guideStep"><b>01 · 添加</b><h2>写下要做的事</h2><p>点击“添加任务”，输入名称和预计用时。系统会自动放进今天的空闲时段。</p></article><article class="guideStep"><b>02 · 打卡</b><h2>开始与结束</h2><p>开始时点击“开始打卡”，做完再点击“结束并完成”。未完成也可以延后或跳过。</p></article><article class="guideStep"><b>03 · 调整</b><h2>计划被打乱也没关系</h2><p>添加临时事项或处理逾期任务，系统会优先保护课程、睡眠和锁定事项，再重新安排任务。</p></article></section><section class="guideGrid" style="margin-top:18px"><article class="guideStep"><b>日历</b><h2>按天查看</h2><p>在“日历”里切换月份，点选日期即可集中查看课程、截止任务和临时事项。</p></article><article class="guideStep"><b>四象限</b><h2>先做更重要的事</h2><p>详细添加任务时勾选“重要”和“紧急”，系统会将待办放入对应象限。</p></article><article class="guideStep"><b>专注</b><h2>25 分钟一轮</h2><p>选中一件待办后开始番茄专注；25 分钟结束自动转为 5 分钟休息。</p></article></section><section class="card" style="margin-top:18px"><p class="eyebrow">提醒说明</p><h2>什么时候会提醒？</h2><p class="subtle">网页打开期间，会在任务开始前 10 分钟、任务开始时和任务逾期后提醒你。提醒只显示在网页内，不会向外发送任何数据。</p></section>`}
  function todayView(){let result=plan(),now=new Date(),overdue=state.tasks.filter(t=>!t.completed&&t.status!=='skipped'&&t.due&&parse(t.due)<now),unscheduled=result.unscheduled.filter(t=>t.id!=='daily-play'),live=buildLiveDashboardValues(result,now),language=activeLanguage();return `<section class="dashboardTop"><div><p class="eyebrow">今日总览 · ${today()}</p><h1>今天的安排</h1><p class="subtle">起床 ${state.settings.wake}　睡觉 ${state.settings.sleep}　玩乐 ${state.settings.play} 分钟</p></div><div class="dayClock" data-live-clock>${escapeHtml(live.clock)}</div></section><section class="status"><article class="card"><span>${message('status.current',{},language)}</span><b data-live-currentTitle>${escapeHtml(live.currentTitle)}</b><small data-live-currentTime>${escapeHtml(live.currentTime)}</small></article><article class="card"><span>下一件</span><b data-live-nextTitle>${escapeHtml(live.nextTitle)}</b><small data-live-nextTime>${escapeHtml(live.nextTime)}</small></article><article class="card ${overdue.length?'warning':''}"><span>${message('status.pending',{},language)}</span><b data-live-pending>${escapeHtml(live.pending)}</b><small data-live-overdue>${escapeHtml(live.overdue)}</small></article></section>${overdue.length?`<div class="alert"><b>有 ${overdue.length} 个任务已超时。</b><span>可以立即重新排入空闲时间。</span><button data-command="overdue">重新安排</button></div>`:''}<section class="card addPanel"><div class="addPanelHead"><b>快速添加</b><span>任务会自动排进空闲时间。</span></div>${addSection()}</section><div class="sectionHead"><div><p class="eyebrow">今日时间轴</p><h2>接下来做什么</h2></div>${state.undo?'<button class="outline" data-command="undo">↶ 撤销调整</button>':''}</div>${timeline(result)}${unscheduled.length?`<div class="alert"><b>暂时排不下：</b><span>${unscheduled.map(t=>escapeHtml(protectUserText(t.title))).join('、')}。可延后、缩短时长或调整作息。</span></div>`:''}`}

  document.addEventListener('change',e=>{let target=e.target;if(target.matches('[data-analytics-date]')){if(isValidDateOnly(target.value)){analyticsDate=target.value;renderApp()}return}if(target.matches('[name="theme"]')){state.settings.theme=normalizeTheme(target.value);applyTheme(state.settings.theme);save();return}if(target.matches('[data-language]')){state.settings.language=normalizeLanguage(target.value);save();renderApp();return}if(target.matches('[data-focus-task]')){state.focus.taskId=target.value;if(!state.focus.running){state.focus.remainingSeconds=1500;state.focus.mode='focus'}save()}});

  document.addEventListener('submit',e=>{let form=e.target,type=form.dataset.form;if(!type)return;let f=new FormData(form),validation='';if(type==='event'&&!isValidInterval(`${String(f.get('start'))}:00`,`${String(f.get('end'))}:00`))validation='validation.eventEnd';if(type==='course'&&(!isValidTime(String(f.get('start')))||!isValidTime(String(f.get('end')))||String(f.get('start'))>=String(f.get('end'))))validation='validation.courseEnd';if(type==='task'&&f.get('due')&&!isValidDateTime(String(f.get('due'))))validation='validation.dueDate';if(type==='settings'&&String(f.get('wake'))===String(f.get('sleep')))validation='validation.matchingSleep';else if(type==='settings'&&(!isValidTime(String(f.get('wake')))||!isValidTime(String(f.get('sleep')))))validation='validation.invalidRoutine';if(validation){e.preventDefault();e.stopImmediatePropagation();notice=message(validation,{},activeLanguage());renderApp()}},true);
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form!=='holiday')return;let f=new FormData(e.target);if(String(f.get('start'))>String(f.get('end'))){e.preventDefault();e.stopImmediatePropagation();notice=message('validation.holidayRange',{},activeLanguage());renderApp()}},true);
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form==='holiday')holidaySubmissionIds=new Set(state.tasks.map(task=>task.id))},true);
  document.addEventListener('submit',e=>{let form=e.target,type=form.dataset.form;if(!type)return;clearDangerConfirmation();e.preventDefault();let f=new FormData(form);
    if(type==='quick-task'){let title=String(f.get('title')).trim();if(!title)return;let taskId=id('task');adjust('添加任务',s=>{let date=planningDate(iso(new Date()),s.settings.wake,s.settings.sleep);s.tasks.push({id:taskId,title,duration:Number(f.get('duration')),priority:'medium',due:dayEndTime(date,s.settings.wake,s.settings.sleep),important:true,urgent:false,status:'pending'});return s});let placed=plan().blocks.find(b=>b.id===taskId),titleField=userField(title);notice=placed?localizedMessage('notice.scheduled',{start:fmt(placed.start),end:fmt(placed.end),title:titleField}):`已添加 ${protectUserText(title)}，暂时没有足够空闲时间`;save();renderApp()}
    if(type==='quick-event'){let title=String(f.get('title')).trim(),start=String(f.get('start'));if(!title||!start)return;let end=iso(new Date(parse(start).getTime()+Number(f.get('duration'))*60000));adjust('加入固定事项',s=>{s.events.push({id:id('event'),title,start:start+':00',end,kind:String(f.get('kind'))});return s})}
    if(type==='calendar-task'){let title=String(f.get('title')).trim();if(!title)return;adjust('添加新任务',s=>{s.tasks.push(createCalendarTask({title,duration:Number(f.get('duration')),priority:String(f.get('priority'))},selectedCalendarDate,s.settings,id('task')));return s})}
    if(type==='task'){let title=String(f.get('title')).trim();if(!title)return;adjust('添加新任务',s=>{let date=planningDate(iso(new Date()),s.settings.wake,s.settings.sleep);s.tasks.push({id:id('task'),title,duration:Number(f.get('duration')),priority:f.get('priority'),due:String(f.get('due')||dayEndTime(date,s.settings.wake,s.settings.sleep)),important:f.get('important')==='on',urgent:f.get('urgent')==='on',leisure:f.get('leisure')==='on',status:'pending'});return s})}
    if(type==='event'){let title=String(f.get('title')).trim(),start=String(f.get('start')),end=String(f.get('end'));if(!title||!start||!end)return;adjust('加入固定事项',s=>{s.events.push({id:id('event'),title,start:start+':00',end:end+':00',kind:f.get('locked')==='on'?'locked':'event'});return s})}
    if(type==='course'){let title=String(f.get('title')).trim();if(!title)return;state.courses.push({id:id('course'),title,day:Number(f.get('day')),start:String(f.get('start')),end:String(f.get('end')),location:String(f.get('location'))});notice='课程已加入每周课表';save();renderApp()}
    if(type==='holiday'){let start=String(f.get('start')),end=String(f.get('end')),title=String(f.get('title')).trim(),minutes=Number(f.get('minutes'));if(!title||!start||!end)return;let d=parse(start+'T12:00:00'),finish=parse(end+'T12:00:00'),tasks=[];while(d<=finish){let date=iso(d).slice(0,10);tasks.push({id:id('holiday'),title:`假期学习：${title} · ${date.slice(5)}`,duration:minutes,priority:'medium',due:dayEndTime(date,state.settings.wake,state.settings.sleep),date,important:true,urgent:false,status:'pending'});d.setDate(d.getDate()+1)}adjust('生成假期学习任务',s=>{s.holidays.push({id:id('holiday'),title,start,end,minutes,notes:String(f.get('notes'))});s.tasks.push(...tasks);return s})}
  });
  document.addEventListener('submit',e=>{if(e.target.dataset.form!=='course')return;let conflicts=findScheduleConflicts(state.courses,state.events);if(conflicts.length){notice=`课程已保存；发现 ${conflicts.length} 处固定事项冲突`;save();renderApp()}});
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form!=='holiday'||!holidaySubmissionIds)return;state.tasks=state.tasks.map(task=>holidaySubmissionIds.has(task.id)?task:{...task,title:task.title.slice('假期学习：'.length),generatedHoliday:true});holidaySubmissionIds=null;save();renderApp()});
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form==='settings')e.target.dataset.language=activeLanguage()},true);
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form==='settings')state.settings.language=normalizeLanguage(e.target.dataset.language)});
  document.addEventListener('submit',e=>{if(e.target?.dataset?.form!=='settings')return;let f=new FormData(e.target);state=updateSettingsState(state,{wake:f.get('wake'),sleep:f.get('sleep'),play:f.get('play'),theme:f.get('theme')??state.settings.theme,navigationLayout:f.get('navigationLayout')??state.settings.navigationLayout});state.settings.language=normalizeLanguage(e.target.dataset.language);applyTheme(state.settings.theme);save();renderApp()});
  document.addEventListener('click',e=>{let button=e.target.closest('button'),command=button?.dataset.command;if(button?.dataset.deleteCourse||['focus-toggle','focus-reset','focus-skip'].includes(command))state=clearUndo(state)},true);
  document.addEventListener('change',e=>{let target=e.target;if(target.matches('[data-language],[data-focus-task]'))state=clearUndo(state)},true);
  document.addEventListener('submit',e=>{if(['course','settings'].includes(e.target?.dataset?.form))state=clearUndo(state)},true);
  setInterval(()=>{let result=plan(),now=iso(new Date()),enqueue=(key,message)=>{if(!reminderKeys.has(key)&&!reminderQueue.some(item=>item.key===key))reminderQueue.push({key,message})};for(const block of result.blocks){let keyForBlock=reminderKey(block,now);if(keyForBlock)enqueue(keyForBlock,getReminderNotice(block,now))}for(const task of state.tasks.filter(t=>!t.completed&&t.status!=='skipped'&&t.due&&parse(t.due)<parse(now)))enqueue(`overdue:${task.id}`,reminderNotice('reminder.overdue',{title:userField(task.title),generatedHoliday:!!task.generatedHoliday}));const editing=document.activeElement&&document.activeElement.matches('input,select,textarea'),mode=refreshMode(reminderQueue.length>0,editing,tab);if(mode==='render'){let displayed=reminderQueue.slice(0,3),batch=takeReminderBatch(reminderQueue,3);reminderQueue=batch.remaining;displayed.forEach(item=>reminderKeys.add(item.key));notice=batch.shown.join(' · ');renderApp()}else if(mode==='live')updateLiveDashboard(document.querySelector('#app'),buildLiveDashboardValues(result,new Date()))},30000);
  focusTimer=setInterval(()=>{let tick=tickFocusState(state,Date.now());if(tick.state===state)return;state=tick.state;if(tick.notice)notice=tick.notice;save();let editing=document.activeElement&&document.activeElement.matches('input,select,textarea');if(tab==='focus'&&!editing)renderApp()},1000);
  todayView=()=>{
    let result=plan(),now=new Date(),overdue=sortOverdueTasks(state.tasks,now),unscheduled=result.unscheduled.filter(task=>task.id!=='daily-play'),live=buildLiveDashboardValues(result,now),language=activeLanguage();
    let overdueQueue=overdue.length?`<section class="card overdueQueue" data-overdue-queue><div class="overdueHead"><div><p class="eyebrow">逾期优先处理</p><h2>逾期任务</h2><p class="subtle">按逾期时长与优先级排列</p></div><button class="primary" data-command="overdue">重新安排</button></div>${overdue.map(task=>{let taskId=escapeHtml(task.id);return `<div class="overdueItem"><div><b>${renderUserField(renderTaskTitle(task))}</b><small>${escapeHtml(overdueAgeLabel(task,now,language))} · ${task.priority==='high'?'高优先级':task.priority==='low'?'低优先级':'普通'}</small></div><div class="overdueActions">${task.status==='pending'?`<button data-act="start" data-id="${taskId}">开始</button>`:''}<button class="primary" data-act="complete" data-id="${taskId}">完成</button><button data-act="delay" data-id="${taskId}">延后</button></div></div>`}).join('')}</section>`:'';
    return `<section class="dashboardTop"><div><p class="eyebrow">今日总览 · ${today()}</p><h1>今天的安排</h1><p class="subtle">起床 ${state.settings.wake}　睡觉 ${state.settings.sleep}　玩乐 ${state.settings.play} 分钟</p></div><div class="dayClock" data-live-clock>${escapeHtml(live.clock)}</div></section><section class="status"><article class="card"><span>${message('status.current',{},language)}</span><b data-live-currentTitle>${escapeHtml(live.currentTitle)}</b><small data-live-currentTime>${escapeHtml(live.currentTime)}</small></article><article class="card"><span>下一件</span><b data-live-nextTitle>${escapeHtml(live.nextTitle)}</b><small data-live-nextTime>${escapeHtml(live.nextTime)}</small></article><article class="card ${overdue.length?'warning':''}"><span>${message('status.pending',{},language)}</span><b data-live-pending>${escapeHtml(live.pending)}</b><small data-live-overdue>${escapeHtml(live.overdue)}</small></article></section>${overdue.length?`<div class="alert"><b>有 ${overdue.length} 个任务已超时。</b><span>可以立即重新排入空闲时间。</span><button data-command="overdue">重新安排</button></div>`:''}${overdueQueue}<section class="card addPanel"><div class="addPanelHead"><b>快速添加</b><span>任务会自动排进空闲时间。</span></div>${addSection()}</section><div class="sectionHead"><div><p class="eyebrow">今日时间轴</p><h2>接下来做什么</h2></div>${state.undo?'<button class="outline" data-command="undo">↶ 撤销调整</button>':''}</div>${timeline(result)}${unscheduled.length?`<div class="alert"><b>暂时排不下：</b><span>${unscheduled.map(task=>escapeHtml(protectUserText(task.title))).join('、')}。可延后、缩短时长或调整作息。</span></div>`:''}`;
  };
  renderApp();
})();
</script></body></html>
